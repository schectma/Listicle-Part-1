<!DOCTYPE html>

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rug Pull Academy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/style.css">
    <script defer src="/scripts/header.js"></script>
    <script defer src="/scripts/grift.js"></script>
  </head>

  <body>
    <header class="container"></header>

    <main id="grift-content" class="container grift-info">
      <div class="image-container">
        <img id="image" src="" alt="">
      </div>
      <div class="grift-details">
        <hgroup>
          <h2 id="title"></h2>
          <p id="category"></p>
        </hgroup>
        <p id="text"></p>
        <blockquote>
          <strong>🚩 Red flag:</strong>
          <span id="redFlag"></span>
        </blockquote>
        <footer class="grift-meta">
          <p id="submittedBy"></p>
          <p id="submittedOn"></p>
          <p id="id"></p>
          <p id="slug"></p>
        </footer>
      </div>
    </main>
  </body>

</html>
